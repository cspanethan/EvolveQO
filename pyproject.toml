[project]
name = "evolveqo"
version = "0.1.0"
description = "LLM-guided co-evolution of cardinality and hint interventions for PostgreSQL"
requires-python = ">=3.11,<3.13"
dependencies = [
    "psycopg[binary]>=3.2.3",
    "sqlglot==18.15.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
extend-select = ["I"]
